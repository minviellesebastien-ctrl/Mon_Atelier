<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6f8">
<meta name="description" content="Gestion des matières">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stock Atelier">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="stylesheet" href="style.css">
<title>Stock Atelier</title>
</head>
<body>
<main class="app">
  <section id="homePage">
    <header class="app-header">
      <div class="brand">
        <div class="brand-cube cube-mark" aria-hidden="true">
  <img src="icon-192.png" alt="">
</div>
        <div><h1>Stock Atelier</h1><p>Gestion des matières</p></div>
      </div>
    </header>
    <section class="materials"><div id="materialsGrid" class="materials-grid"></div></section>
  </section>

  <section id="materialPage" hidden>
    <header class="material-header">
      <button id="backHomeBtn" class="back-button" type="button">←</button>
      <h1 id="materialPageTitle"></h1><span></span>
    </header>
    <div id="cartonEntry" class="carton-entry" hidden><div class="carton-entry-title">Ajouter un emballage</div><div class="carton-entry-row"><input id="cartonInput" placeholder="Ex. caisse 400 × 300 × 200"><input id="cartonQty" type="number" min="1" value="1"><button id="cartonAddBtn" type="button">+</button></div></div><div id="thicknessList" class="thickness-list"></div>
  </section>
</main>

<div id="addModal" class="modal-backdrop" hidden>
  <div class="add-modal" role="dialog" aria-modal="true" aria-labelledby="addTitle">
    <div class="modal-header">
      <div><h2 id="addTitle">Ajouter une matière</h2><p>Créer ou compléter une référence</p></div>
      <button id="closeModalBtn" class="modal-close" type="button">×</button>
    </div>
    <form id="addForm">
      <label class="form-field"><span>Matière</span><select id="materialSelect" required></select></label>
      <label class="form-field"><span>Couleur</span><input id="colorInput" required placeholder="Ex. Blanc"></label>
      <label class="form-field"><span>Épaisseur</span>
        <select id="thicknessSelect" required>
          <option value="" disabled selected>Choisir</option>
          <option value="0.5">0,5 mm</option><option value="0.75">0,75 mm</option><option value="1">1 mm</option><option value="1.5">1,5 mm</option><option value="2">2 mm</option><option value="3">3 mm</option><option value="5">5 mm</option>
          <option value="8">8 mm</option><option value="10">10 mm</option>
          <option value="12">12 mm</option><option value="15">15 mm</option><option value="16mm">16 mm</option>
          <option value="19">19 mm</option>
        </select>
      </label>
      <label class="form-field"><span>Format</span><input id="formatInput" required placeholder="Ex. 3050 × 1500"></label>
      <label class="form-field"><span>Quantité reçue</span><input id="quantityInput" type="number" min="1" step="1" value="1" required></label>
      <p id="existingReference" class="existing-reference" hidden></p>
      <div class="modal-actions"><button id="cancelModalBtn" class="secondary-button" type="button">Annuler</button><button class="primary-button" type="submit">Enregistrer</button></div>
    </form>
  </div>
</div>

<div id="editModal" class="modal-backdrop" hidden><div class="add-modal" role="dialog" aria-modal="true"><div class="modal-header"><div><h2>Modifier la référence</h2><p>Mettre à jour les informations ou la quantité</p></div><button id="closeEditBtn" class="modal-close" type="button">×</button></div><form id="editForm"><label class="form-field"><span>Couleur</span><input id="editColorInput" required></label><label class="form-field"><span>Épaisseur</span><select id="editThicknessSelect" required><option value="0.5">0,5 mm</option><option value="0.75">0,75 mm</option><option value="1">1 mm</option><option value="1.5">1,5 mm</option><option value="2">2 mm</option><option value="3">3 mm</option><option value="5">5 mm</option><option value="8">8 mm</option><option value="10">10 mm</option><option value="12">12 mm</option><option value="15">15 mm</option><option value="19">19 mm</option></select></label><label class="form-field"><span>Format</span><input id="editFormatInput" required></label><label class="form-field"><span>Quantité</span><input id="editQuantityInput" type="number" min="0" step="1" required></label><p class="edit-help">Une quantité de 0 conserve la référence sans stock.</p><div class="modal-actions"><button id="cancelEditBtn" class="secondary-button" type="button">Annuler</button><button class="primary-button" type="submit">Enregistrer</button></div></form></div></div></div>
<footer class="bottom-bar">
  <button id="importBtn" class="bottom-action" type="button"><span>↓</span>Importer</button>
  <button id="addBtn" class="add-button" type="button" aria-label="Ajouter">+</button>
  <button id="exportBtn" class="bottom-action" type="button"><span>↑</span>Exporter</button>
</footer>
<input id="fileInput" type="file" accept=".json,application/json" hidden>
<script src="script.js"></script>

  <script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .catch(error => console.error('Service Worker:', error));
  });
}
  </script>
</body>
</html>
